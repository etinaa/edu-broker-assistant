spring:
  application:
    name: edu-broker-assistant

# The provider is chosen here (or with the LLM_PROVIDER variable); the code does not change (task 2).
llm:
  provider: ${LLM_PROVIDER:ollama}        # ollama | claude
  claude:
    model: ${CLAUDE_MODEL:claude-haiku-4-5}
    api-key: ${ANTHROPIC_API_KEY:}
    max-tokens: 1024
    # Prices in USD per million tokens; check them against Anthropic's current pricing for the chosen model.
    input-price-per-million: 1.00
    output-price-per-million: 5.00
  ollama:
    base-url: http://localhost:11434
    model: "${OLLAMA_MODEL:qwen2.5:14b}"
    # Context window: the session history plus the tool definitions must fit in it (lesson 1.5).
    num-ctx: 16384

agent:
  max-steps: 6
  temperature: 0.0
  # Session history limit in messages. Older exchanges are dropped whole; the latest one always stays.
  max-history-messages: 40
  # Sessions and traces kept in memory; the least recently used session and the oldest trace go first.
  max-sessions: 1000
  max-traces: 1000
  # How long a message waits for another message of the same session before 409 "session busy".
  session-busy-timeout: 2s

broker:
  # An order not confirmed within this time is EXPIRED.
  order-ttl: 5m
  # How far the price may move against the client (BUY: up, SELL: down) before confirm fails with PRICE_CHANGED.
  max-price-move-percent: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ai.lab.broker.llm: INFO
    # DEBUG logs the raw requests to and responses from the models: the whole conversation and the client's cash and
    # positions in plain text. Local debugging only, never in a shared environment.
    llm-payload: INFO
